services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zk
      POSTGRES_PASSWORD: zkpass
      POSTGRES_DB: zk_attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zk -d zk_attendance"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: zk
      DATABASE_PASSWORD: zkpass
      DATABASE_NAME: zk_attendance
      SECRET_KEY_BASE: dev-secret-change-me-please
      # --- device connection ---
      ZK_HOST: "192.168.10.15"
      ZK_PORT: "80"
      ZK_USER: "999"
      ZK_PASS: "999"
      # --- app login ---
      APP_USER: admin
      APP_PASSWORD: attendance123
      # local time used in export filename timestamp (Pakistan = +05:00)
      TZ_OFFSET: "+05:00"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
